services:
  app:
    image: mcr.microsoft.com/playwright:v1.58.1-noble
    working_dir: /app
    init: true
    shm_size: 1gb
    environment:
      CONTAINER_DEV: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - frontend_dependencies:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
volumes:
  frontend_dependencies:
