<text x="40" y="1685" fill="#eaedf0" font-family="Arial,sans-serif" font-size="17" font-weight="400">01   The hero remains the opening experience; SIT leads. Other projects stay directly reachable.</text>
<text x="40" y="1717" fill="#eaedf0" font-family="Arial,sans-serif" font-size="17" font-weight="400">02   Finished / Field notes appears only where useful, approved process material exists.</text>
<text x="40" y="1749" fill="#eaedf0" font-family="Arial,sans-serif" font-size="17" font-weight="400">03   One decorative contour field sits below the project content and fades before the scroll cue.</text>
<text x="40" y="1781" fill="#eaedf0" font-family="Arial,sans-serif" font-size="17" font-weight="400">04   Phone views stack naturally; controls have 44px minimum targets. No forced scrolling.</text>
<text x="40" y="1813" fill="#eaedf0" font-family="Arial,sans-serif" font-size="17" font-weight="400">05   Lower-page image rhythm and brief process notes add depth. R&amp;D slots require real CMS selections.</text>
<text x="40" y="1847" fill="#aeb5bf" font-family="Arial,sans-serif" font-size="12" font-weight="400">SCHEMATIC / final spacing, responsive sizing and source-image limits follow the accompanying review notes.</text>
